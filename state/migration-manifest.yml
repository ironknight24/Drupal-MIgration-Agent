# ==============================================================================
# DRUPAL MIGRATION AGENT FRAMEWORK — MIGRATION MANIFEST
# ==============================================================================
# Answers: "WHAT exactly are we migrating?"
#
# Static inventory, dependency definitions, target version specifications,
# and architectural scope metadata populated during Discovery & Dependency Analysis.
# ==============================================================================

version: "1.0"
generated_at: null # Populated during Discovery
source_system:
  drupal_core_version: "7.x"
  php_version: ""
  database_type: "mysql"
target_system:
  drupal_core_version: "10.x" # Or 11.x
  php_version: ""
  composer_root: "./"

# ------------------------------------------------------------------------------
# 1. Custom Modules Inventory
# ------------------------------------------------------------------------------
# Schema for each custom module:
# - name: "my_module"
#   source_path: "sites/all/modules/custom/my_module"
#   target_path: "web/modules/custom/my_module"
#   d7_entry_file: "my_module.module"
#   declared_dependencies: [] # from .info
#   implicit_dependencies: [] # hook alters, shared tables, .inc cross-calls
#   target_strategy: "OOP_REENGINEERING" # OOP_REENGINEERING | CUSTOM_ENTITY | EXTRACT_SERVICE
#   requires_custom_schema: false
#   # Comprehensive .inc Source File & Functionality Accounting
#   inc_files:
#     - path: "includes/my_module.admin.inc"
#       include_type: "MODULE_LOAD_INCLUDE" # DIRECT_REQUIRE | MODULE_LOAD_INCLUDE | MENU_ROUTER_INCLUDE | AUTOLOAD_FILES | DYNAMIC_INCLUDE | UNVERIFIED
#       parent_callers: ["my_module.module"]
#       functions:
#         - name: "my_module_admin_settings_form"
#           classification: "FORM_HANDLER" # CONTROLLER_PAGE | FORM_HANDLER | SERVICE_BUSINESS_LOGIC | PLUGIN_CANDIDATE | EVENT_SUBSCRIBER | ACCESS_CHECKER | ENTITY_FIELD_LOGIC | QUEUE_WORKER | BATCH_PROCESSOR | CRON_HANDLER | DRUSH_COMMAND | CONFIGURATION_HANDLER | THEME_RENDERER | UTILITY_HELPER | DATABASE_DATA_ACCESS | INTEGRATION_CLIENT | TEST_SUPPORT | LEGACY_OBSOLETE
#           callers: ["my_module_menu()"]
#           target_d10: "src/Form/SettingsForm.php"
#           status: "MIGRATED" # MIGRATED | REPLACED | OBSOLETE | EXCLUDED_WITH_REASON | HUMAN_DECISION_REQUIRED | UNVERIFIED
#           exclusion_reason: null
#       drush_commands: [] # Discovered Drush command implementations
custom_modules: []

# ------------------------------------------------------------------------------
# 2. Contributed Modules Strategy Inventory
# ------------------------------------------------------------------------------
# Schema for each contrib module:
# - name: "views"
#   d7_version: "7.x-3.24"
#   d10_evaluation: "CORE_MERGED" # CORE_MERGED | D10_AVAILABLE | D11_READY | COMMUNITY_REPLACEMENT | CUSTOM_REIMPLEMENTATION | OBSOLETE
#   satisfaction_source: "target_core" # target_core | contrib_module | custom_module | none
#   recommended_replacement: "drupal/core"
#   requires_config_migration: true
#   requires_data_migration: true
contrib_modules: []

# ------------------------------------------------------------------------------
# 3. Custom Themes Inventory
# ------------------------------------------------------------------------------
# Schema for each theme:
# - name: "my_theme"
#   source_path: "sites/all/themes/my_theme"
#   target_path: "web/themes/custom/my_theme"
#   base_theme: "olivero" # olivero | claro | starterkit | false
#   tier: 1 # 1: Direct | 2: Review | 3: Redesign
themes: []

# ------------------------------------------------------------------------------
# 4. Configuration & Entities Inventory
# ------------------------------------------------------------------------------
# Schema for configuration items:
# - type: "content_type" # content_type | taxonomy_vocabulary | field | view | image_style | role
#   name: "article"
#   source_reference: "node_type"
#   target_config_file: "node.type.article.yml"
configuration: []

