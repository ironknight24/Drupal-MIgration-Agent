# ==============================================================================
# DRUPAL MIGRATION AGENT FRAMEWORK — CONFIGURATION TEMPLATE
# ==============================================================================
# This configuration file controls the migration of a Drupal 7 codebase to
# Drupal 10 (with Drupal 11-ready architectural patterns).
#
# IMPORTANT:
# - Do NOT place credentials, passwords, API keys, database tokens, or secrets
#   in this file.
# - The source path is treated as strictly READ-ONLY by all agents.
# - All write operations must target the target path.
# ==============================================================================

version: "1.0"

# Source Environment (Drupal 7)
# NOTE: These are framework default templates. In an actual migration workspace,
# point 'path' to the project-specific Drupal 7 root directory.
source:
  drupal_version: "7"
  path: "drupal7"
  # Subdirectories within source path (relative to source.path)
  custom_modules_path: "modules/custom"
  custom_themes_path: "themes"
  sites_path: "sites/default"
  # Database inspection metadata (read-only introspection)
  database:
    driver: "mysql"
    host: "localhost"
    port: 3306
    name: "" # Set via environment or project config; NO SECRETS HERE
    prefix: ""

# Target Environment (Drupal 10)
target:
  drupal_version: "10"
  path: "drupal"
  # Web root / project layout (relative to target.path)
  web_root: "web"
  custom_modules_path: "web/modules/custom"
  custom_themes_path: "web/themes/custom"
  config_sync_directory: "config/sync"

# Scope & Migration Toggles
migration:
  migrate_custom_modules: true
  migrate_custom_themes: true
  migrate_configuration: true
  migrate_data: true
  migrate_contrib_modules: true
  migrate_integrations: true
  run_tests: true
  behavioral_validation: true

# Source Control & Git Safety Guardrails
# NOTE: Commits and branch creation are strictly disabled by default.
# All changes must be tracked through file-change logs and diffs.
git:
  allow_commits: false
  allow_branch_creation: false

# Agent Autonomy & Execution Constraints
agents:
  autonomous_modification: false
  require_plan_before_modification: true
  # Maximum retries on transient errors before marking component BLOCKED
  max_retries_per_component: 2
  # Path protection enforcement
  enforce_path_isolation: true
  disallow_d7_writes: true

# Validation Rules & Tolerance
validation:
  compare_d7_behavior: true
  compare_data: true
  run_phpunit: true
  run_static_analysis: true
  # Tolerance for data migrations: strict | balanced | permissive
  data_integrity_threshold: "strict"

# Blocked Work & Exception Handling
# If an agent encounters a blocked component, it documents the issue and proceeds
# with non-dependent tasks unless a global migration safety violation occurs.
blocked_work:
  continue_other_tasks: true
  generate_blocked_report: true

# Configurable Test Suite Execution
# Tool presence is verified dynamically during Discovery; commands are executed
# only when enabled and tools exist in the target project.
testing:
  enabled: false
  tools:
    phpunit:
      enabled: false
      command: "vendor/bin/phpunit -c web/core/phpunit.xml"
    phpstan:
      enabled: false
      command: "vendor/bin/phpstan analyze --memory-limit=1G"
    phpcs:
      enabled: false
      command: "vendor/bin/phpcs --standard=Drupal,DrupalPractice web/modules/custom"
